[project]
name = "chief-of-staff"
version = "0.1.0"
description = "Chief of Staff: a self-contained personal AI chief of staff"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cos = "cos.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
