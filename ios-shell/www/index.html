<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chief of Staff</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 17px/1.45 -apple-system, system-ui, sans-serif; margin: 0; padding: 48px 24px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: #666; max-width: 32em; margin: 0 auto 24px; }
  button { font: inherit; padding: 10px 20px; border-radius: 10px; border: 0; background: #0a7aff; color: #fff; }
</style>
</head>
<body>
<h1>Can't reach your Chief of Staff server</h1>
<p>Check that the server is running and that this phone is on a network that can reach it, then try again.</p>
<button onclick="location.reload()">Try again</button>
</body>
</html>
