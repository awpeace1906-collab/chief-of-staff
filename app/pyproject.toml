[project]
name = "chief-of-staff"
version = "0.4.0"
description = "Chief of Staff: a self-contained personal AI chief of staff"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "anthropic>=1.15",
  "python-multipart>=0.0.9",
  "cryptography>=42",  # Telnyx webhook signatures (Ed25519)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
push = ["pyjwt[crypto]>=2.8", "httpx[http2]>=0.27"]
voice = ["faster-whisper>=1.0", "av<19"]  # PyAV 19 dropped an argument faster-whisper 1.2 uses

[project.scripts]
cos = "cos.cli:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cos*"]

[tool.setuptools.package-data]
cos = ["web/*.html", "web/*.js", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
